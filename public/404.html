<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | HUMOR LABS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0B0B0B; color: #F7F6EF; font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; text-align: center; }
    main { display: grid; gap: 20px; justify-items: center; max-width: 640px; }
    img { width: 96px; height: auto; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: .95; letter-spacing: -.04em; text-transform: uppercase; }
    h1 mark { background: #C6FF00; color: #0B0B0B; padding: 0 .12em; }
    p { margin: 0; color: #a9a89f; font-size: 1.1rem; line-height: 1.5; }
    a { display: inline-block; margin-top: 8px; padding: 16px 28px; border-radius: 999px; background: #C6FF00; color: #0B0B0B; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
    a:hover, a:focus-visible { background: #F7F6EF; outline: 3px solid #C6FF00; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" width="96" height="77">
    <h1>That page is <mark>boring</mark>. It doesn't exist.</h1>
    <p>The link may be old or mistyped. The good stuff is on the home page.</p>
    <a href="/">Back to the lab</a>
  </main>
</body>
</html>
